name: Attach verified original Beta9 Android APK
on:
  push:
    branches: [delivery/beta9-original-chat-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact official app APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v0.9.0-beta.9 --repo "$GITHUB_REPOSITORY" \
            --pattern "TotiChat-Beta-0.9.0-beta.9.apk" --dir "$GITHUB_WORKSPACE"
          printf '%s  %s\n' \
            'ac513de5ea592ae77ed868f554cf9b77586436539d095a461da0fb17647b1930' \
            'TotiChat-Beta-0.9.0-beta.9.apk' | sha256sum -c -
          test "$(stat -c %s TotiChat-Beta-0.9.0-beta.9.apk)" -eq 32808853
          unzip -tq TotiChat-Beta-0.9.0-beta.9.apk >/dev/null
      - name: Preserve APK as direct conversation attachment
        uses: actions/upload-artifact@v4
        with:
          name: original-beta9-apk-verified
          path: TotiChat-Beta-0.9.0-beta.9.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
