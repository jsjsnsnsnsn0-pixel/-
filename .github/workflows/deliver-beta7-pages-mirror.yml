name: Mirror verified Beta.7 APK to GitHub Pages
on:
  push:
    branches:
      - delivery/beta7-pages-mirror-20261008
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.9.0-beta.7 --repo "$GITHUB_REPOSITORY" \
            --pattern 'TotiChat-Beta-0.9.0-beta.7.apk' --dir "$GITHUB_WORKSPACE"
          printf '%s  %s\n' \
            '38767d10795d67a9196d0ac884adbfc8b0ce0dff05526cceef1bdff609ea8055' \
            'TotiChat-Beta-0.9.0-beta.7.apk' | sha256sum -c -
          test "$(stat -c %s TotiChat-Beta-0.9.0-beta.7.apk)" -eq 32798554
      - name: Checkout existing GitHub Pages branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: pages-site
          persist-credentials: true
          fetch-depth: 1
      - name: Add APK as a new file without changing existing Pages content
        shell: bash
        run: |
          set -euo pipefail
          cd pages-site
          mkdir -p downloads
          cp ../TotiChat-Beta-0.9.0-beta.7.apk downloads/TotiChat-Beta-0.9.0-beta.7.apk
          printf '%s  %s\n' \
            '38767d10795d67a9196d0ac884adbfc8b0ce0dff05526cceef1bdff609ea8055' \
            'downloads/TotiChat-Beta-0.9.0-beta.7.apk' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/TotiChat-Beta-0.9.0-beta.7.apk
          git diff --cached --stat
          git diff --cached --name-only | grep -qx downloads/TotiChat-Beta-0.9.0-beta.7.apk
          git commit -m 'delivery: mirror verified 32 MB Beta.7 APK for easier mobile downloads'
          git push origin HEAD:gh-pages
      - name: Check public mirror responds with complete SHA-256-matching APK
        shell: bash
        run: |
          set -euo pipefail
          url='https://jsjsnsnsnsn0-pixel.github.io/TotiChat/downloads/TotiChat-Beta-0.9.0-beta.7.apk'
          for attempt in $(seq 1 18); do
            if curl -fLsS --connect-timeout 8 --max-time 45 "$url" -o /tmp/pages-beta7.apk; then
              hash="$(sha256sum /tmp/pages-beta7.apk | cut -d' ' -f1)"
              if [[ "$hash" == '38767d10795d67a9196d0ac884adbfc8b0ce0dff05526cceef1bdff609ea8055' ]]; then
                echo "Verified alternate mirror: $url"
                stat -c 'Mirrored APK size: %s bytes' /tmp/pages-beta7.apk
                exit 0
              fi
              echo "Mirror not yet propagated: hash $hash"
            fi
            sleep 10
          done
          echo 'Mirror not verified; do not publish this URL as working.' >&2
          exit 1
