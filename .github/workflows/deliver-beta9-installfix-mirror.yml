name: Mirror verified Beta.9 Install-Fix APK to GitHub Pages
on:
  push:
    branches:
      - delivery/beta9-installfix-pages-20261008
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.9.0-beta.9-installfix.1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'TotiChat-Beta9-InstallFix.apk' --dir "$GITHUB_WORKSPACE"
          printf '%s  %s\n' \
            '8f10cea5efc8a5aa3bfd5e0a8bdb3f1b52a82b60bb8fe64d291ae0a4049f3778' \
            'TotiChat-Beta9-InstallFix.apk' | sha256sum -c -
          test "$(stat -c %s TotiChat-Beta9-InstallFix.apk)" -eq 32808877
      - name: Checkout existing GitHub Pages branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: gh-pages
          path: pages-site
          persist-credentials: true
          fetch-depth: 1
      - name: Add APK as a new file without changing existing Pages content
        shell: bash
        run: |
          set -euo pipefail
          cd pages-site
          mkdir -p downloads
          cp ../TotiChat-Beta9-InstallFix.apk downloads/TotiChat-Beta9-InstallFix.apk
          printf '%s  %s\n' \
            '8f10cea5efc8a5aa3bfd5e0a8bdb3f1b52a82b60bb8fe64d291ae0a4049f3778' \
            'downloads/TotiChat-Beta9-InstallFix.apk' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/TotiChat-Beta9-InstallFix.apk
          if git diff --cached --quiet; then
            echo 'The SHA-256-verified Beta.9 Install-Fix APK already exists in gh-pages.'
          else
            git diff --cached --stat
            git diff --cached --name-only | grep -qx downloads/TotiChat-Beta9-InstallFix.apk
            git commit -m 'delivery: mirror verified 32 MB Beta.9 Install-Fix APK for easier mobile downloads'
            git push origin HEAD:gh-pages
          fi
      - name: Check public mirror responds with complete SHA-256-matching APK
        shell: bash
        run: |
          set -euo pipefail
          url='https://jsjsnsnsnsn0-pixel.github.io/TotiChat/downloads/TotiChat-Beta9-InstallFix.apk'
          for attempt in $(seq 1 18); do
            if curl -fLsS --connect-timeout 8 --max-time 45 "$url" -o /tmp/pages-beta9-installfix.apk; then
              hash="$(sha256sum /tmp/pages-beta9-installfix.apk | cut -d' ' -f1)"
              if [[ "$hash" == '8f10cea5efc8a5aa3bfd5e0a8bdb3f1b52a82b60bb8fe64d291ae0a4049f3778' ]]; then
                echo "Verified alternate mirror: $url"
                stat -c 'Mirrored APK size: %s bytes' /tmp/pages-beta9-installfix.apk
                exit 0
              fi
              echo "Mirror not yet propagated: hash $hash"
            fi
            sleep 10
          done
          echo 'Mirror not verified; do not publish this URL as working.' >&2
          exit 1
