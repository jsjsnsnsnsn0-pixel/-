function escapeHTML(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function syncComposer(){
 if(!composerOpen)return;
 const wrap=document.getElementById('composerWrap');if(!wrap)return;
 const vv=window.visualViewport;
 const inset=vv?Math.max(0,window.innerHeight-(vv.height+vv.offsetTop)):0;
 wrap.style.bottom=inset+'px';
}
function openComposer(){
 closeSheet();
 const wrap=document.getElementById('composerWrap');
 wrap.hidden=false;composerOpen=true;
 document.documentElement.classList.add('in-composer');
 syncComposer();
 const input=document.getElementById('composerInput');input.focus({preventScroll:true});
}
function closeComposer(){
 composerOpen=false;
 const wrap=document.getElementById('composerWrap');if(wrap){wrap.hidden=true;wrap.style.bottom='0px';}
 document.documentElement.classList.remove('in-composer');
 const input=document.getElementById('composerInput');if(input)input.blur();
}
function sendPreviewMessage(){
 const input=document.getElementById('composerInput');
 const message=input.value.trim();
 if(!message)return;
 previewMessages.push(message.slice(0,500)); if(previewMessages.length>30)previewMessages.shift();
 chatTab='الكل';closeComposer();render();
 const area=document.querySelector('.chatArea');if(area)area.scrollTop=area.scrollHeight;
 showToast('ظهرت الرسالة داخل المعاينة فقط، ولم تُرسل إلى السيرفر');
}

function showRoomInfo(){const tab=roomInfoTab;showSheet(head('معلومات الغرفة')+'<div class="minirow">'+im('room1')+'<div><b>ليالي TotiChat</b><br><small>ID: 9728390 · 🇮🇶</small></div></div><div class="roominfo">'+['معلومات','عضو (15)','الفعالية'].map(t=>'<button '+act('roomInfoTab',t)+' class="'+(t===tab?'active':'')+'">'+t+'</button>').join('')+'</div>'+(tab==='معلومات'?'<h4>👑 المالك</h4><div class="minirow">'+im('male')+'<span>توتي　VIP 5<br><small>🇮🇶 ID: 30301</small></span></div><h4>📣 إعلان الغرفة</h4><div class="cardwhite" style="background:#ffffff16;color:#fff">مرحباً بكم في غرفة TotiChat</div>':tab.startsWith('عضو')?people.slice(0,7).map(p=>'<div class="minirow">'+im(p[1])+'<span>'+p[0]+'<br><small>'+p[2]+'</small></span></div>').join(''):'<div class="empty" style="color:#ccc">🎁 فعاليات الغرفة ومواعيدها تظهر هنا</div>')+'<div style="display:flex;gap:10px;margin-top:12px"><button class="primary" '+act('toast','المتابعة غير مفعلّة في المعاينة')+'>♡ متابعة</button><button class="primary" '+act('toast','الانضمام إجراء فعلي خارج المعاينة')+'>انضم</button></div>')}
function showGifts(){const all=gifts[giftTab]||gifts.هدية;const g=all[giftChosen]||null;showSheet(head('صندوق الهدايا')+'<div class="recipient">'+people.slice(0,7).map((p,i)=>'<button class="'+(recipient===i?'selected':'')+'" '+act('recipient',i)+'>'+im(p[1])+'</button>').join('')+'</div><div class="giftTabs">'+['هدية','الحظ','الحظ Pro','CP'].map(x=>'<button class="'+(giftTab===x?'active':'')+'" '+act('giftTab',x)+'>'+x+'</button>').join('')+'</div><div class="giftgrid">'+all.map((item,i)=>'<button class="giftitem '+(giftChosen===i?'selected':'')+'" '+act('giftSelect',i)+'><span class="gicon">'+item[1]+'</span><b>'+item[0]+'</b><small>🪙 '+item[2]+'</small></button>').join('')+'</div><div class="sendrow"><span>🪙 الرصيد: 0 <br><small style="color:#bbb">معاينة فقط</small></span><select id="qty"><option>1</option><option>7</option><option>17</option><option>77</option><option>777</option></select><button class="primary" '+act('sendGift')+' '+(!g?'disabled':'')+'>إرسال</button></div>')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-a]');if(!el)return;let a=el.dataset.a,v=el.dataset.v||'';if(a==='go'){closeSheet();closeComposer();go(v)}else if(a==='openPrivateChat'){vt.selectedChat=v;go('chatPreview')}else if(a==='privateSend'){let inp=document.getElementById('previewPrivateInput');if(inp&&inp.value.trim()){vt.demoChat[vt.selectedChat].push(inp.value.trim().slice(0,500));render();showToast('رسالة معاينة محلية فقط')}}else if(a==='vipSelect'){vt.vip=Math.max(1,Math.min(8,Number(v.split(' ')[1])));render()}else if(a==='chargeTab'){vt.charge=v;render()}else if(a==='chargePick'){vt.chargePack=Number(v);render()}else if(a==='walletSelect'){vt.wallet=v;render()}else if(a==='agencySelect'){vt.agency=v;render()}else if(a==='storeSelect'){vt.store=v;render()}else if(a==='back')back();else if(a==='close')closeSheet();else if(a==='closeComposer')closeComposer();else if(a==='sendPreview')sendPreviewMessage();else if(a==='sheet')sheet(v);else if(a==='toast')showToast(v);else if(a==='tab'){homeTab=v;render()}else if(a==='filter'){if(v==='country')showToast('عرض غرف '+country+' في المعاينة');else showToast('شائع 🔥');}else if(a==='country'){country=v;closeSheet();render()}else if(a==='owned'){owned=v;render()}else if(a==='rank'){rankTab=v;render()}else if(a==='period'){period=v;render()}else if(a==='seat'){let i=Number(v);if(i<5){sheet('user:'+i)}else if([9,10,12,13].includes(i)){sheet('user:'+(i===9?5:i===10?6:i===12?7:8))}else showToast('المقعد مغلق · فتح المايك يعتمد على الصلاحيات الحقيقية')}else if(a==='chatTab'){chatTab=v;render()}else if(a==='recipient'){recipient=Number(v);showGifts()}else if(a==='giftTab'){giftTab=v;giftChosen=-1;showGifts()}else if(a==='giftSelect'){giftChosen=Number(v);showGifts()}else if(a==='sendGift'){showToast('تمت معاينة اختيار الهدية — لم يُخصم أي رصيد ولم تُرسل عملية حقيقية');closeSheet()}else if(a==='roomInfoTab'){roomInfoTab=v;showRoomInfo()}else if(a==='option'){if(v==='switch'){const s=el.querySelector('.switch');if(s)s.classList.toggle('on')}else if(v==='network')sheet('network');else if(v==='permission')showToast('في تطبيق Android: تُفتح صفحة أذونات TotiChat في إعدادات الهاتف');else showToast('هذا الخيار للمراجعة البصرية فقط')}});
document.addEventListener('input',e=>{if(e.target.id==='composerInput'){document.querySelector('.composer-send').disabled=!e.target.value.trim();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&composerOpen)closeComposer();if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='composerInput'){e.preventDefault();sendPreviewMessage();}});
if(window.visualViewport){window.visualViewport.addEventListener('resize',syncComposer);window.visualViewport.addEventListener('scroll',syncComposer);}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
document.getElementById('loading-logo').src=A+assets.logo;
render();
setInterval(()=>{if(screen==='home'&&homeTab==='حفلة'&&!document.getElementById('overlay').classList.contains('show')){banner=(banner+1)%3;const h=document.querySelector('.hero img');if(h)h.src=A+assets[['hero','hero2','hero3'][banner]];document.querySelectorAll('.dots i').forEach((e,i)=>e.className=i===banner?'on':'')}},6500);
</script></body></html>
